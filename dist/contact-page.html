<!-- contact-form.html -->
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">


   <link rel="stylesheet" href="contact-style.css">
   <title>Contact NewLedo</title>
   <link rel="icon" type="image/x-icon" href="favicon.ico">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
   <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
   <script>if (window.trustedTypes && window.trustedTypes.createPolicy) {
         window.trustedTypes.createPolicy('default', {
            createHTML: (string) => string,
            createScript: (string) => string,
            createScriptURL: (string) => string
         });
      }
   </script>
</head>

<body onload="ipload()">

   <a class="h1_a" href="/">

      <div class="hero-text">
         <h1>Newledo</h1>
      </div>
      </div>
   </a>
   <h3 id="inTouch" class="Get-In-Touch">Get In Touch</h3>
   </div>
   <div class="container">
      <form id="contact-form" method="POST" action="sendMail" enctype="multipart/form-data">
         <div class="cf-turnstile" data-callback="enableSubmit" data-sitekey="1x00000000000000000000AA"
            data-theme="light" data-size="normal"></div>
         <label id='nameLable'  class="inputLable">*Your Name</label>
         <input id="name" disabled hidden class='inpt' type="text" onfocus="animateCSS('nameLable','fadeInUp')" name="name"
            placeholder="*Your Name" required>
         <label id="emailLable" class="inputLable">*Email Address</label>
         <input id="email" disabled hidden class='inpt' type="email" onfocus="animateCSS('emailLable','fadeInUp')" name="email"
            placeholder="*Email Address" required>
         <label id="phoneLable" class="inputLable">Phone Number</label>
         <input id="phone" disabled hidden class='inpt' type="tel" onfocus="animateCSS('phoneLable','fadeInUp')" name="phone"
            placeholder="Phone Number">
         <label id="messageLable" class="inputLable">How may we help you?</label>
         <textarea id="message" disabled hidden class='inpt' rows="4" onfocus="animateCSS('messageLable','fadeInUp')"
            placeholder="How may we help you?"></textarea><!-- autocomplete='off' -->
         <div class="credit">*Required only so we may contact you.</div>

         <button id="submitButton" class="btn" type="submit" value="Send" disabled hidden>Send</button>
      </form>
      <div id="shim"></div>
      <div id="msgbx" style='display: none'>
         <a class="h1_a" href="/">
            <h2>Newledo</h2>
         </a>
         <div id="center">
            <h3 class="thanks"> Thank you for your interest. </h3> <br>
            <div id="parent">
               <h4> We will contact you as soon as possible</h4>
            </div>

            <a href="/"><input type="button" value="Back"></input></a> <!-- class="saveBtn" class="popBtn" -->

         </div>

      </div>
   </div>
   </div><br><br><br>
   <br><br>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.1.3/axios.min.js"></script>
   <!-- <script type="text/javascript" src="dist/js/purify.min.js"></script> -->
   <script defer type="application/javascript" src='index.js'>
   </script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"
      integrity="sha512-78KH17QLT5e55GJqP76vutp1D2iAoy06WcYBXB6iBCsmO6wWzx0Qdg8EDpm8mKXv68BcvHOyeeP4wxAL0twJGQ=="
      crossorigin="anonymous" referrerpolicy="no-referrer"></script>

   <script defer type="application/javascript" src="animate_element.js"></script>
   <script></script>
   <br><br><br><br><br><br><br><br><br><br>
   <div>
      <p id="ip" style="color:lightgray;"></p>
   </div>
</body>

</html>
